<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimic Chess: become what you take</title>
<meta name="description" content="Mimic Chess: a chess puzzle where you become what you land on. Turn into a rook, bishop or king, dodge guards, take them to steal their moves, and collect every coin in as few moves as possible.">
<meta name="theme-color" content="#3b2a1e">
<style>
  :root {
    --table: #3b2a1e; --table2: #4a3527;
    --frame: #2a1d14; --frame-hi: #5a4232;
    --light: #ecdcbf; --dark: #c49a6c;
    --hole: #24382c;
    --paper: #f6efe2; --paper-edge: #e4d6bd; --ink: #2b1f17; --muted: #7a6654;
    --brass: #d8a83c; --brass-dk: #8a6418; --accent: #a3412b;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --u: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body {
    color: var(--paper); font-family: var(--sans);
    background-color: var(--table);
    background-image:
      repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(88deg, rgba(0,0,0,.05) 0 1px, transparent 1px 23px),
      radial-gradient(ellipse at 50% 35%, var(--table2), var(--table) 70%);
  }
  #app { --w: min(calc(100vw - 32px), calc(100dvh - 330px), 540px); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2) var(--u) calc(var(--u) * 2 + env(safe-area-inset-bottom)); }

  /* top bar: aligned to the board edges */
  .top { width: var(--w); display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; }
  .title { text-align: center; font-family: var(--serif); line-height: 1.1; }
  .title b { display: block; font-size: 22px; font-weight: 600; letter-spacing: .01em; color: var(--paper); }
  .title small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #c9b291; margin-top: 2px; font-family: var(--sans); font-weight: 600; }
  .icon { width: 48px; height: 48px; border-radius: 12px; border: 0; background: transparent; color: #e9d9bd; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon:hover { background: rgba(255,255,255,.06); }
  .icon:active { transform: translateY(1px); }
  .icon svg { width: 24px; height: 24px; }
  .icon:focus-visible, .btn:focus-visible, .lv:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* board */
  .frame { width: calc(var(--w) + 20px); padding: 10px; border-radius: 10px; background: linear-gradient(160deg, var(--frame-hi), var(--frame) 40%); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 30px rgba(0,0,0,.45), 0 2px 4px rgba(0,0,0,.4); }
  #board { position: relative; width: var(--w); aspect-ratio: 1; border-radius: 3px; overflow: hidden; touch-action: manipulation; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .cell { position: absolute; display: grid; place-items: center; }
  .cell.l { background: var(--light); } .cell.d { background: var(--dark); }
  .cell.l, .cell.d { background-image: linear-gradient(135deg, rgba(255,255,255,.08), rgba(0,0,0,.04)); }
  .cell.l { background-color: var(--light); } .cell.d { background-color: var(--dark); }
  .cell.wall { background: var(--hole); box-shadow: inset 0 6px 10px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.06); }
  .cell.target { cursor: pointer; }
  .cell.target::before { content: ""; width: 26%; height: 26%; border-radius: 50%; background: rgba(43,31,23,.28); transition: transform .12s; }
  .cell.target:hover::before { transform: scale(1.25); background: rgba(43,31,23,.38); }
  .cell.hint { box-shadow: inset 0 0 0 4px var(--brass); }
  .cell.hint::before { background: rgba(138,100,24,.55); }
  .cell.last::after { content: ""; position: absolute; inset: 0; background: rgba(216,168,60,.22); }
  .coord { position: absolute; font: 600 10px var(--sans); color: rgba(43,31,23,.45); pointer-events: none; }
  .coin { position: absolute; display: grid; place-items: center; pointer-events: none; transition: transform .35s cubic-bezier(.2,.9,.3,1.4), opacity .35s; }
  .coin i { width: 46%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbe39a, var(--brass) 45%, var(--brass-dk) 100%); box-shadow: 0 3px 0 #6b4c10, 0 5px 6px rgba(0,0,0,.3), inset 0 0 0 3px rgba(255,240,190,.35); position: relative; }
  .coin i::after { content: ""; position: absolute; inset: 26%; border-radius: 50%; border: 2px solid rgba(107,76,16,.45); }
  .coin.got { transform: translateY(-40%) scale(.4); opacity: 0; }
  #knight { position: absolute; display: grid; place-items: center; pointer-events: none; z-index: 3; }
  #knight .shadow { position: absolute; bottom: 12%; width: 52%; height: 12%; border-radius: 50%; background: rgba(0,0,0,.28); filter: blur(1px); }
  #knight svg { width: 76%; height: 76%; position: relative; overflow: visible; }

  /* status line */
  .status { width: var(--w); display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #e5d3b3; min-height: 24px; }
  .status b { font-family: var(--serif); font-size: 18px; color: var(--paper); font-weight: 600; }
  .coins { display: flex; gap: 5px; align-items: center; }
  .coins span { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #b99a6a; }
  .coins span.on { background: var(--brass); border-color: var(--brass); box-shadow: 0 0 0 2px rgba(216,168,60,.2); }
  .coach { width: var(--w); text-align: center; color: #e5d3b3; font-size: 15px; min-height: 22px; margin: 12px 0 0; }

  /* bottom controls */
  .controls { width: var(--w); display: grid; grid-template-columns: 1fr 1fr; gap: var(--u); }
  .btn { height: 52px; border-radius: 12px; border: 0; font: 600 16px var(--sans); color: var(--ink); background: var(--paper); box-shadow: 0 3px 0 var(--paper-edge), 0 5px 10px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .btn svg { width: 20px; height: 20px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-edge), 0 2px 4px rgba(0,0,0,.25); }
  .btn[disabled] { opacity: .55; cursor: default; transform: none; }
  .btn .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--paper); font-size: 12px; display: inline-grid; place-items: center; }
  .btn.go { background: var(--accent); color: #fff4e8; box-shadow: 0 3px 0 #6e2618, 0 5px 10px rgba(0,0,0,.3); }
  .btn.go:active { box-shadow: 0 1px 0 #6e2618; }

  /* result panel replaces the controls (no pop-up over the board) */
  .result { width: var(--w); display: none; grid-template-columns: 1fr 1fr; gap: var(--u); }
  .result .msg { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px 14px; box-shadow: 0 5px 10px rgba(0,0,0,.25); }
  .result .msg b { font-family: var(--serif); font-size: 20px; display: block; }
  .result .msg span { color: var(--muted); font-size: 14px; }
  .seal { width: 44px; height: 44px; flex: none; }
  body.won .controls { display: none; } body.won .result { display: grid; animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }

  /* level book (full-screen sheet) */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); color: var(--ink); overflow-y: auto; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: none; }
  .sheet .inner { width: min(100%, 560px); margin: 0 auto; padding: 16px 16px 40px; }
  .sheet header { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; position: sticky; top: 0; background: var(--paper); padding: 4px 0 8px; z-index: 1; }
  .sheet header h2 { margin: 0; text-align: center; font-family: var(--serif); font-weight: 600; font-size: 24px; }
  .sheet .icon { color: var(--ink); } .sheet .icon:hover { background: rgba(0,0,0,.05); }
  .daily { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--paper-edge); background: #fffaf1; cursor: pointer; font: inherit; color: inherit; margin: 6px 0 22px; }
  .daily b { font-family: var(--serif); font-size: 18px; display: block; } .daily span { color: var(--muted); font-size: 14px; }
  .daily .cal { width: 44px; height: 44px; border-radius: 8px; background: var(--accent); color: #fff4e8; display: grid; place-items: center; font: 700 18px var(--serif); flex: none; }
  .chapter h3 { margin: 18px 0 8px; font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); display: flex; justify-content: space-between; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--paper-edge); }
  .lv { aspect-ratio: 1; border: 0; font: 600 18px var(--serif); color: var(--ink); cursor: pointer; position: relative; display: grid; place-items: center; }
  .lv:nth-child(odd) { background: var(--light); } .lv:nth-child(even) { background: #dcc29a; }
  .lv[disabled] { color: rgba(43,31,23,.3); cursor: default; }
  .lv.cur { box-shadow: inset 0 0 0 3px var(--accent); }
  .lv .mk { position: absolute; bottom: 7px; width: 9px; height: 9px; border-radius: 50%; }
  .lv .mk.gold { background: var(--brass); } .lv .mk.silver { background: #9aa3ab; } .lv .mk.done { background: rgba(43,31,23,.35); }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin-top: 20px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .opts { display: flex; gap: 8px; margin-top: 18px; }
  .opts button { font: 600 14px var(--sans); border: 1.5px solid var(--paper-edge); background: #fffaf1; color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.35); transition: .25s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<style>
  /* ---- additions for the shapeshift version ---- */
  .layer { position: absolute; display: grid; place-items: center; pointer-events: none; }
  .badge-sq i { width: 62%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 35%, rgba(255,250,235,.55), rgba(255,240,210,.15)); box-shadow: inset 0 0 0 2px rgba(122,86,20,.55), inset 0 2px 4px rgba(0,0,0,.18); }
  .badge-sq svg { width: 70%; height: 70%; opacity: .62; }
  .badge-sq.same i { opacity: .45; }
  .crack-sq svg { width: 100%; height: 100%; }
  .cell.crumbled { background: var(--hole) !important; box-shadow: inset 0 6px 10px rgba(0,0,0,.55); }
  .portal-sq i { width: 78%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed var(--pc); box-shadow: 0 0 0 3px rgba(0,0,0,.08), inset 0 0 12px var(--pc); animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .guard { z-index: 2; transition: left .26s cubic-bezier(.3,.7,.4,1), top .26s cubic-bezier(.3,.7,.4,1), opacity .3s, transform .3s; }
  .guard svg { width: 72%; height: 72%; overflow: visible; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  .guard.gone { opacity: 0; transform: translateY(30%) scale(.5); }
  .cell.threat::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(190,50,30,.32) 0 3px, rgba(190,50,30,.06) 3px 10px); box-shadow: inset 0 0 0 1.5px rgba(190,50,30,.5); }
  .cell.track > b { position: absolute; left: 43%; top: 43%; width: 14%; height: 14%; border-radius: 50%; background: rgba(163,65,43,.45); }
  .cell.next { box-shadow: inset 0 0 0 3px rgba(163,65,43,.7); }
  .cell.target.bad::before { background: none; width: 30%; height: 30%; border-radius: 0; background-image: linear-gradient(45deg, transparent 42%, rgba(163,65,43,.75) 42% 58%, transparent 58%), linear-gradient(-45deg, transparent 42%, rgba(163,65,43,.75) 42% 58%, transparent 58%); }
  .cell.target.cap::before { width: 70%; height: 70%; background: none; border: 3px solid rgba(43,31,23,.45); border-radius: 50%; }
  .cell.hint.cap::before { border-color: var(--brass); }
  .shape { display: inline-flex; align-items: center; gap: 6px; }
  .shape svg { width: 20px; height: 20px; }
  .tip { position: absolute; z-index: 4; pointer-events: none; }
  .intro { width: var(--w); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 10px 14px; margin-top: 12px; display: none; align-items: center; gap: 12px; box-shadow: 0 5px 10px rgba(0,0,0,.25); font-size: 14px; line-height: 1.35; }
  .intro.on { display: flex; animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  .intro b { font-family: var(--serif); font-size: 16px; display: block; }
  .intro .new { flex: none; font: 700 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; background: var(--accent); color: #fff4e8; padding: 5px 8px; border-radius: 6px; }
  .chap-card .msg { background: linear-gradient(180deg, #fffaf0, var(--paper)); }
  .chap-card .stars { display: flex; gap: 4px; margin-top: 4px; }
  .chap-card .stars i { width: 10px; height: 10px; border-radius: 50%; background: rgba(43,31,23,.25); }
  .chap-card .stars i.gold { background: var(--brass); } .chap-card .stars i.silver { background: #9aa3ab; }
  .chapter h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .grid.six { grid-template-columns: repeat(6, 1fr); }
  .grid.four { grid-template-columns: repeat(4, 1fr); }

  /* ---- v4: layout (portrait stack / wide two-column) ---- */
  #app { --w: min(calc(100vw - 32px), calc(100dvh - 372px), 540px); }
  .side { display: contents; }
  .top { order: -1; } .frame { order: 0; } .status { order: 1; } .dock { order: 2; }
  .dock { width: var(--w); height: 138px; display: flex; flex-direction: column; gap: 10px; }
  .note { display: flex; flex-direction: column; gap: 8px; }
  .coach { margin: 0; width: 100%; }
  .intro { width: 100%; margin: 0; }
  body.won .note { display: none; }
  .intro.on + .coach { display: none; }
  @media (min-aspect-ratio: 5/4) {
    #app { --w: min(calc(100dvh - 44px), calc(100vw - 372px), 760px); --side: clamp(240px, 26vw, 320px);
      display: grid; grid-template-columns: auto var(--side); column-gap: 28px; align-items: center; justify-content: center; height: 100dvh; min-height: 0; padding: 12px 16px; }
    .side { display: flex; flex-direction: column; gap: 14px; width: var(--side); }
    .top, .status, .dock, .controls, .result, .coach, .intro { width: 100%; }
    .dock { height: auto; }
    .coach { text-align: left; }
    .top { grid-template-columns: 44px 1fr 44px; }
    .title b { font-size: 21px; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 420px) {
    .side { gap: 8px; } .btn { height: 44px; font-size: 15px; } .icon { width: 40px; height: 40px; }
    .intro { padding: 7px 10px; font-size: 13px; } .intro b { font-size: 14px; } .coach { font-size: 13px; }
    .result .msg { padding: 8px 10px; } .result .msg b { font-size: 17px; } .seal { width: 36px; height: 36px; }
    #app { padding: 6px 12px; --w: min(calc(100dvh - 36px), calc(100vw - 340px), 760px); }
  }
  .status { flex-wrap: nowrap; white-space: nowrap; gap: 8px; }
  .brand { order: -2; width: var(--w); text-align: center; font: 700 15px var(--serif); letter-spacing: .32em; text-transform: uppercase; color: #f2cf6b; text-shadow: 0 2px 0 rgba(0,0,0,.35); margin-bottom: -8px; }
  @media (min-aspect-ratio: 5/4) { .brand { width: 100%; font-size: clamp(18px, 2.4vw, 26px); letter-spacing: .22em; margin: 0 0 4px; } }
  @media (max-aspect-ratio: 5/4) and (max-height: 720px) { .brand { font-size: 13px; margin-bottom: -6px; } }
  @media (max-aspect-ratio: 5/4) and (max-height: 720px) {
    #app { --w: min(calc(100vw - 32px), calc(100dvh - 372px), 540px); gap: 10px; padding-top: 8px; padding-bottom: 8px; }
    .dock { height: 126px; gap: 8px; } .result .msg span { font-size: 13px; line-height: 1.25; } .chap-card .msg small { margin-top: 2px; } .btn { height: 46px; font-size: 15px; } .intro { padding: 7px 10px; font-size: 13px; } .intro b { font-size: 14px; } .coach { font-size: 14px; }
    .result .msg { padding: 8px 10px; } .result .msg b { font-size: 17px; } .seal { width: 36px; height: 36px; }
  }
  /* chapter tints for the table */
  body[data-ch="2"] { --table: #34302b; --table2: #4a443c; }
  body[data-ch="3"] { --table: #3a2220; --table2: #53302b; }
  body[data-ch="4"] { --table: #232a33; --table2: #333d49; }
  body[data-ch="5"] { --table: #1f2f2d; --table2: #2c4441; }
  body[data-ch="6"] { --table: #2b2236; --table2: #3e3150; }
  body { transition: background-color .6s; }
  /* clearer pits */
  .cell.wall, .cell.crumbled { background: radial-gradient(circle at 50% 42%, #0c0805 0 45%, #22170f 100%) !important; box-shadow: inset 0 8px 12px rgba(0,0,0,.75), inset 0 0 0 2px rgba(0,0,0,.3) !important; }
  /* move dots drawn above coins, badges and guards */
  .cell.target::before { position: relative; z-index: 4; background: rgba(43,31,23,.42); box-shadow: 0 0 0 2px rgba(255,248,232,.6); }
  .cell.target.cap::before { box-shadow: none; }
  .cell.target.onitem:not(.bad)::before { width: 80%; height: 80%; background: none; border: 3px solid #f2cf6b; box-shadow: 0 0 0 2px rgba(43,31,23,.35), inset 0 0 0 1px rgba(43,31,23,.25); }
  .coin.reach i, .badge-sq.reach i { animation: reach 1.4s ease-in-out infinite; }
  @keyframes reach { 50% { box-shadow: 0 3px 0 #6b4c10, 0 0 0 5px rgba(255,236,170,.55), 0 0 14px 4px rgba(255,214,120,.55); } }
  .badge-sq.reach i { --r: 1; }
  .cell.hint { box-shadow: inset 0 0 0 5px var(--brass); animation: hintp 1s ease-in-out infinite; z-index: 1; }
  @keyframes hintp { 50% { box-shadow: inset 0 0 0 8px #f2cf6b, 0 0 18px 4px rgba(242,207,107,.6); } }
  .cell.hint::before { background: #f2cf6b !important; width: 34% !important; height: 34% !important; }
  #board.flash .cell.target::before { animation: dotflash .5s ease-out 2; }
  @keyframes dotflash { 50% { transform: scale(1.6); background: rgba(216,168,60,.9); } }
  .cell.track > b { transform: rotate(45deg); border-radius: 2px; width: 12%; height: 12%; background: rgba(163,65,43,.6); }
  /* juice */
  .fx { position: absolute; pointer-events: none; z-index: 6; }
  .spark { width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: radial-gradient(circle, #fff6cf, #f2cf6b 55%, #d8a83c); }
  .float { transform: translate(-50%, -50%); font: 800 clamp(14px, 3.4vmin, 22px) var(--serif); color: #fff3d1; text-shadow: 0 2px 0 #6b4c10, 0 0 8px rgba(0,0,0,.5); white-space: nowrap; letter-spacing: .04em; }
  .ring { border-radius: 50%; border: 3px solid #f2cf6b; transform: translate(-50%, -50%); }
  .confetti { width: 8px; height: 13px; border-radius: 2px; }
  .coins span.pop { animation: cpop .45s cubic-bezier(.2,.9,.3,1.6); }
  @keyframes cpop { 40% { transform: scale(1.7); } }
  .btn[disabled] { opacity: .45; box-shadow: none; background: rgba(246,239,226,.55); }
  .btn .badge.wait { font-variant-numeric: tabular-nums; background: var(--muted); }
  .chap-card .msg small { display: block; margin-top: 4px; color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#3a2a20"/><stop offset=".55" stop-color="#1f1610"/><stop offset="1" stop-color="#120c08"/></linearGradient>
  <linearGradient id="ivory" x1="0" x2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#eadbbf"/><stop offset="1" stop-color="#c9b28c"/></linearGradient>
</defs></svg>
<div id="app">
  <div class="frame"><div id="board" role="grid" aria-label="Board"></div></div>
  <div class="side">
  <div class="brand" aria-label="Mimic Chess">Mimic Chess</div>
  <div class="top">

// ===== Rules engine + solver (shared by the game and the offline level curator) =====
// Level: { s, start, piece, holes[], coins[], badges{idx:piece}, cracks[], guards[{t, path[]}], portals[[a,b]] }
// Pieces: N knight, R rook, B bishop, K king.
const ENGINE = (() => {
  const PIECES = ['N', 'R', 'B', 'K'];
  const KN = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
  const ORTH = [[1,0],[-1,0],[0,1],[0,-1]], DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]], ALL = ORTH.concat(DIAG);

  // Pre-index a level for fast lookups.
  function prep(L) {
    if (L._p) return L._p;
    const N = L.s * L.s;
    const hole = new Uint8Array(N); (L.holes || []).forEach((i) => (hole[i] = 1));
    const coinIdx = new Int8Array(N).fill(-1); (L.coins || []).forEach((c, i) => (coinIdx[c] = i));
    const crackIdx = new Int8Array(N).fill(-1); (L.cracks || []).forEach((c, i) => (crackIdx[c] = i));
    const badge = new Array(N).fill(null); Object.entries(L.badges || {}).forEach(([k, v]) => (badge[+k] = v));
    const portal = new Int16Array(N).fill(-1); (L.portals || []).forEach(([a, b]) => { portal[a] = b; portal[b] = a; });
    const guards = (L.guards || []).map((g) => g);
    let period = 1;
    const gcd = (a, b) => (b ? gcd(b, a % b) : a);
    for (const g of guards) { const p = g.path.length > 1 ? 2 * (g.path.length - 1) : 1; period = (period * p) / gcd(period, p); }
    L._p = { N, hole, coinIdx, crackIdx, badge, portal, guards, period, full: (1 << (L.coins || []).length) - 1 };
    return L._p;
  }
  // Ping-pong patrol position at turn t.
  function gpos(g, t) { const n = g.path.length; if (n === 1) return g.path[0]; const p = 2 * (n - 1), k = t % p; return g.path[k < n ? k : p - k]; }

  function initState(L) {
    const P = prep(L);
    const st = { pos: L.start, piece: L.piece || 'N', coins: 0, crumb: 0, cap: 0, t: 0 };
    if (P.coinIdx[L.start] >= 0) st.coins |= 1 << P.coinIdx[L.start];
    return st;
  }
  function blocked(L, P, st, i) { return P.hole[i] || (P.crackIdx[i] >= 0 && (st.crumb >> P.crackIdx[i]) & 1); }
  // Map of square -> guard index for live guards at turn t.
  function guardMap(L, P, st, t) { const m = new Map(); P.guards.forEach((g, gi) => { if (!((st.cap >> gi) & 1)) m.set(gpos(g, t), gi); }); return m; }

  // Raw destinations for the player's current piece (before safety).
  function dests(L, st) {
    const P = prep(L), s = L.s, x0 = st.pos % s, y0 = Math.floor(st.pos / s), out = [];
    const gm = guardMap(L, P, st, st.t);
    const ok = (x, y) => x >= 0 && y >= 0 && x < s && y < s;
    if (st.piece === 'N' || st.piece === 'K') {
      for (const [dx, dy] of st.piece === 'N' ? KN : ALL) { const x = x0 + dx, y = y0 + dy; if (!ok(x, y)) continue; const i = y * s + x; if (!blocked(L, P, st, i)) out.push(i); }
    } else {
      for (const [dx, dy] of st.piece === 'R' ? ORTH : DIAG) {
        let x = x0 + dx, y = y0 + dy;
        while (ok(x, y)) { const i = y * s + x; if (blocked(L, P, st, i)) break; out.push(i); if (gm.has(i)) break; x += dx; y += dy; }
      }
    }
    return out;
  }
  // Squares attacked (or occupied) by live guards at turn t, given state blockers.
  function danger(L, st, t) {
    const P = prep(L), s = L.s, set = new Set(), gm = guardMap(L, P, st, t);
    const ok = (x, y) => x >= 0 && y >= 0 && x < s && y < s;
    for (const [sq, gi] of gm) {
      const g = P.guards[gi], x0 = sq % s, y0 = Math.floor(sq / s); set.add(sq);
      if (g.t === 'N' || g.t === 'K') { for (const [dx, dy] of g.t === 'N' ? KN : ALL) { const x = x0 + dx, y = y0 + dy; if (ok(x, y)) set.add(y * s + x); } }
      else for (const [dx, dy] of g.t === 'R' ? ORTH : DIAG) {
        let x = x0 + dx, y = y0 + dy;
        while (ok(x, y)) { const i = y * s + x; if (blocked(L, P, st, i)) break; set.add(i); if (gm.has(i)) break; x += dx; y += dy; }
      }
    }
    return set;
  }
  // Apply a move. Returns { st, safe, events } where events describe what happened (for animation/sound).
  function apply(L, st, to) {
    const P = prep(L), n = { ...st }, ev = { from: st.pos, land: to, to, portal: false, coin: false, capture: -1, shift: null, crumble: -1 };
    if (P.crackIdx[st.pos] >= 0) { n.crumb |= 1 << P.crackIdx[st.pos]; ev.crumble = st.pos; }
    const gm = guardMap(L, P, st, st.t);
    if (gm.has(to)) { const gi = gm.get(to); n.cap |= 1 << gi; ev.capture = gi; n.piece = P.guards[gi].t; ev.shift = n.piece; }
    let at = to;
    if (P.portal[to] >= 0) { at = P.portal[to]; ev.portal = true; }
    ev.to = at; n.pos = at;
    if (ev.capture < 0 && P.badge[at] && P.badge[at] !== n.piece) { n.piece = P.badge[at]; ev.shift = n.piece; }
    if (P.coinIdx[at] >= 0 && !((n.coins >> P.coinIdx[at]) & 1)) { n.coins |= 1 << P.coinIdx[at]; ev.coin = true; }

    const safe = !danger(L, n, n.t).has(at);
    return { st: n, safe, ev };
  }
  const won = (L, st) => st.coins === prep(L).full;
  const key = (L, st) => { const P = prep(L); return ((((st.pos * 4 + PIECES.indexOf(st.piece)) * 64 + st.coins) * 1024 + st.crumb) * 16 + st.cap) * P.period + (st.t % P.period); };

  // BFS shortest solution from a state. Returns array of move targets, or null.
  function solve(L, st0, opts = {}) {
    const limit = opts.limit || 400000;
    const start = st0 || initState(L);
    if (won(L, start)) return [];
    const seen = new Map([[key(L, start), null]]);
    const q = [start], via = [null];
    const parent = [-1];
    for (let h = 0; h < q.length; h++) {
      if (q.length > limit) return null;
      const st = q[h];
      for (const d of dests(L, st)) {
        const r = apply(L, st, d); if (!r.safe) continue;
        const k = key(L, r.st); if (seen.has(k)) continue; seen.set(k, 1);
        q.push(r.st); via.push(d); parent.push(h);
        if (won(L, r.st)) { const path = []; let c = q.length - 1; while (c > 0) { path.push(via[c]); c = parent[c]; } return path.reverse(); }
      }
    }
    return null;
  }
  // Stats used for curation: depth layers + number of shortest solutions + count of states.
  function analyse(L) {
    const start = initState(L), k0 = key(L, start);
    const dist = new Map([[k0, 0]]), ways = new Map([[k0, 1]]), q = [start]; let best = -1, sols = 0;
    for (let h = 0; h < q.length; h++) {
      if (q.length > 300000) return null;
      const st = q[h], k = key(L, st), d = dist.get(k);
      if (best >= 0 && d >= best) break;
      for (const to of dests(L, st)) {
        const r = apply(L, st, to); if (!r.safe) continue;
        const nk = key(L, r.st);
        if (!dist.has(nk)) { dist.set(nk, d + 1); ways.set(nk, ways.get(k)); q.push(r.st); if (won(L, r.st)) { best = d + 1; sols += ways.get(k); } }
        else if (dist.get(nk) === d + 1) { ways.set(nk, ways.get(nk) + ways.get(k)); if (won(L, r.st)) sols += ways.get(k); }
      }
    }
    return { par: best, sols, states: dist.size };
  }
  return { PIECES, prep, gpos, initState, dests, danger, apply, won, solve, analyse };
})();

<script>
'use strict';
const E = ENGINE;

const CHAPTERS = (() => { let n = 1; return [

const CAMPAIGN = LEVELS.campaign.length;

};

  return `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="1.2" stroke-linejoin="round">${BODY[t]}${det}</g>${BASE(base, stroke)}</svg>`;
}
const CRACK = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 9l9 7-3 6 9 4-2 8M21 26l9-3 5 7M15 16l8-8" fill="none" stroke="rgba(60,40,25,.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PORTAL_COLOURS = ['#2f8f83', '#7e57c2'];

// ---------- state ----------

function load(n, isDaily = false) {

}

// ---------- board ----------
const pct = () => 100 / L.s;

function draw() {

  });

}

// ---------- juice ----------
const centre = (i) => [((i % L.s) + 0.5) * pct(), (Math.floor(i / L.s) + 0.5) * pct()];
function fx(cls, i, html = '') { const e = document.createElement('div'); e.className = 'fx ' + cls; const [x, y] = centre(i); e.style.left = x + '%'; e.style.top = y + '%'; e.innerHTML = html; board.append(e); return e; }

}

  e.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(2.2)', opacity: 0 }], { duration: 520, easing: 'ease-out' }).onfinish = () => e.remove(); }

  for (let k = 0; k < n; k++) { const e = document.createElement('div'); e.className = 'fx confetti'; e.style.left = Math.random() * 100 + '%'; e.style.top = '-4%'; e.style.background = cols[k % cols.length]; board.append(e);
    const dx = (Math.random() - .5) * 120, rot = (Math.random() - .5) * 900;
    e.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${dx}px, ${board.clientHeight * (0.9 + Math.random() * .3)}px) rotate(${rot}deg)`, opacity: .9, offset: .85 }, { transform: `translate(${dx}px, ${board.clientHeight * 1.1}px) rotate(${rot}deg)`, opacity: 0 }], { duration: 1300 + Math.random() * 900, delay: Math.random() * 300, easing: 'cubic-bezier(.3,.6,.5,1)' }).onfinish = () => e.remove(); }
}

// ---------- CrazyGames SDK (no-op elsewhere) ----------
let CG = null, muted = false, completions = 0, adsOk = true, adArmed = 0, wantPlay = false, sentPlay = false;
const cg = (f) => { try { if (CG) f(CG); } catch {} };
// gameplayStart/Stop only on real state changes, and replayed once the SDK is ready.
function setPlaying(on) { wantPlay = on; if (!CG || sentPlay === on) return; sentPlay = on; cg((S) => (on ? S.game.gameplayStart() : S.game.gameplayStop())); }
(async () => { try { if (window.CrazyGames && window.CrazyGames.SDK) { await window.CrazyGames.SDK.init(); if (window.CrazyGames.SDK.environment !== 'disabled') CG = window.CrazyGames.SDK; } } catch {}
  cg((S) => S.game.addSettingsChangeListener?.(() => {}));
  if (L) { draw(); setPlaying(wantPlay); } })();
const sdkMuted = () => { try { return !!(CG && CG.game.settings && CG.game.settings.muteAudio); } catch { return false; } };
function ad(type) { return new Promise((res) => { if (!CG) return res(false); const was = wantPlay; setPlaying(false);
  const done = (ok) => { muted = false; setPlaying(was && !won); res(ok); };
  CG.ad.requestAd(type, { adStarted: () => { muted = true; }, adFinished: () => done(true), adError: () => done(type !== 'rewarded') }); }); }

// ---------- sound ----------
let ac;
function actx() { if (!save.sound || muted || sdkMuted()) return null; try { ac ||= new AudioContext(); if (ac.state === 'suspended') ac.resume(); return ac; } catch { return null; } }
function clack(vol = 0.35, f0 = 1100) {
  const a = actx(); if (!a) return;
  const len = Math.floor(a.sampleRate * 0.05), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = f0 + Math.random() * 300; f.Q.value = 3; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function tone(freq = 1568, t0 = 0, type = 'sine', vol = 0.12, len = 0.35) {
  const a = actx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  const t = a.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + 0.05);
}
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch {} };
const shake = () => board.animate?.([{ transform: 'translateX(0)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }], { duration: 160 });

// ---------- input ----------
board.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('.cell'); if (!c || won || busy) return;
  if (c.classList.contains('target') && !c.classList.contains('bad')) move(+c.dataset.i);
  else if (c.classList.contains('bad')) { shake(); buzz(30); tone(180, 0, 'triangle', 0.1, 0.2); toast('A guard would catch you there'); }
  else if (!c.classList.contains('wall')) { shake(); tone(220, 0, 'triangle', 0.06, 0.12); board.classList.remove('flash'); void board.offsetWidth; board.classList.add('flash'); if (++tappedWrong <= 2) toast(`A ${NAMES[st.piece].toLowerCase()} can't reach that. Tap a dot.`); }
});
function move(to) {
  const from = st.pos, r = E.apply(L, st, to); if (!r.safe) return;
  history.push({ st }); st = r.st; hintTo = -1; busy = true;
  const ev = r.ev, slide = history[history.length - 1].st.piece;
  const dur = slide === 'N' ? 280 : Math.min(420, 180 + 45 * Math.hypot((from % L.s) - (ev.land % L.s), Math.floor(from / L.s) - Math.floor(ev.land / L.s)));
  // move to the landing square first (portal entry), then resolve
  place($('#knight'), ev.land); moveAnim(from, ev.land, slide, dur);
  if (ev.crumble >= 0) { const cr = board.children[ev.crumble]; setTimeout(() => { clack(0.25, 300); cr.animate?.([{ filter: 'brightness(1)' }, { filter: 'brightness(.5)' }], { duration: 200 }); }, 80); }
  setTimeout(() => {
    clack(); buzz(8);
    if (ev.capture >= 0) { tone(330, 0, 'triangle', 0.14, 0.25); tone(495, 0.06, 'triangle', 0.1, 0.25); buzz(25); burst(ev.land, 14, ['#fffaf0', '#a3412b', '#eadbbf']); }
    const finish = () => {
      if (ev.shift) { morph(ev.shift); ring(ev.to); floatText(ev.to, NAMES[ev.shift] + '!'); tone(784, 0, 'sine', 0.1, 0.3); tone(1175, 0.08, 'sine', 0.08, 0.3); }
      if (ev.coin) { tone(1568); tone(2093, 0.07); buzz(18); burst(ev.to, 12); if (!ev.shift) floatText(ev.to, '+1'); const got = L.coins.filter((g) => (st.coins >> E.prep(L).coinIdx[g]) & 1).length; setTimeout(() => $('#coins').children[got - 1]?.classList.add('pop'), 30); }
      if (!daily && COACH[levelNo]) coachStep = history.length;
      const done = E.won(L, st); if (done) won = true;
      setCoach(); draw(); busy = false;
      if (done) setTimeout(win, 260); else parCheck();
    };
    if (ev.portal) {
      const k = $('#knight'); tone(520, 0, 'sine', 0.08, 0.4); tone(780, 0.1, 'sine', 0.06, 0.4);
      k.animate?.([{ transform: 'scale(1)' }, { transform: 'scale(.1) rotate(90deg)' }], { duration: 160 });
      setTimeout(() => { place(k, ev.to); k.animate?.([{ transform: 'scale(.1) rotate(-90deg)' }, { transform: 'scale(1)' }], { duration: 200 }); finish(); }, 160);
    } else finish();
  }, dur - 40);
  // guards step now so they move alongside (draw handles position)
  board.querySelectorAll('.guard').forEach((e) => { const gi = +e.dataset.gi; if ((st.cap >> gi) & 1) e.classList.add('gone'); });
  setTimeout(() => board.querySelectorAll('.guard').forEach((e) => { const g = E.prep(L).guards[+e.dataset.gi]; place(e, E.gpos(g, st.t)); }), dur * 0.6);
}
function undo() { if (won || busy) return; const h = history.pop(); if (!h) return; const from = st.pos; st = h.st; hintTo = -1; const k = $('#knight'); k.innerHTML = '<span class="shadow"></span>' + pieceSVG(st.piece, false); moveAnim(from, st.pos, st.piece, 200); clack(.2); setCoach(); draw(); }
function restart() { if (busy) return; won = false; document.body.classList.remove('won'); st = E.initState(L); history = []; hintTo = -1; coachStep = 0; parNote = false; build(); setCoach(); draw(); setPlaying(true); }
$('#undo').onclick = undo; $('#restart').onclick = restart;
// Hints: up to 3, one free hint recharges every 2 minutes; perfect solves give +1; a rewarded ad can skip the wait.
const HINT_MAX = 3, HINT_MS = 120000;
function refill() { const now = Date.now(); if (save.hints >= HINT_MAX) { save.nextHint = 0; return; } if (!save.nextHint) save.nextHint = now + HINT_MS; while (save.hints < HINT_MAX && now >= save.nextHint) { save.hints++; save.nextHint += HINT_MS; } if (save.hints >= HINT_MAX) save.nextHint = 0; persist(); }
const waitText = () => { const ms = Math.max(0, (save.nextHint || 0) - Date.now()), m = Math.floor(ms / 60000), sec = Math.ceil((ms % 60000) / 1000); return sec === 60 ? `${m + 1}:00` : `${m}:${String(sec).padStart(2, '0')}`; };
function hintBadge() { refill(); const b = $('#hintCount'); if (save.hints > 0) { b.textContent = save.hints; b.classList.remove('wait'); } else { b.textContent = waitText(); b.classList.add('wait'); } }
setInterval(() => { if (save.hints <= 0 || save.nextHint) hintBadge(); }, 1000);
$('#hintBtn').onclick = async () => {
  if (won || hintTo >= 0 || busy) return;
  const path = E.solve(L, st);
  if (!path || !path.length) return toast('No way to win from here. Undo a move.');
  refill();
  if (save.hints <= 0) {
    let ok = false;
    if (CG && adsOk) {
      if (!(adArmed > Date.now())) { adArmed = Date.now() + 4000; return toast(`Next free hint in ${waitText()}. Tap Hint again to watch a short ad instead.`); }
      adArmed = 0; ok = await ad('rewarded'); if (!ok) adsOk = false;
    }
    if (!ok) return toast(`Next free hint in ${waitText()}`);
    save.hints = 1;
  }
  save.hints--; if (!save.nextHint) save.nextHint = Date.now() + HINT_MS; persist(); hintTo = path[0]; draw(); tone(988, 0, 'sine', 0.08, 0.25);
};
// Nudge once if par is no longer possible.
function parCheck() {
  if (daily || levelNo <= 2 || parNote || won) return;
  const rest = E.solve(L, st);
  if (!rest) { setCoach('No way to win from here. Undo a move.'); return; }
  if (history.length + rest.length > L.par) { parNote = true; setCoach('Par is out of reach now. Restart (R) to go for gold.'); }
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

// ---------- win ----------
const rankOf = (m) => (m <= L.par ? 3 : m <= L.par + 2 ? 2 : 1);
function win() {
  won = true;
  const m = history.length, rank = rankOf(m), kind = ['', 'done', 'silver', 'gold'][rank];
  let bonus = false;
  if (!daily) {
    const before = save.stars[levelNo] || 0;
    if (rank === 3 && before < 3 && save.hints < HINT_MAX) { save.hints++; bonus = true; refill(); }
    save.stars[levelNo] = Math.max(before, rank); save.unlocked = Math.max(save.unlocked, levelNo + 1); persist();
  } else { save.daily = { day: todaySeed(), rank: Math.max(rank, save.daily?.day === todaySeed() ? save.daily.rank : 0) }; persist(); }
  const ch = chapterOf(levelNo), chapterDone = !daily && levelNo === ch.to;
  $('#seal').innerHTML = sealSVG(kind);
  $('#result').classList.toggle('chap-card', chapterDone);
  $('#chapStars').innerHTML = '';
  if (chapterDone) {
    const ranks = []; for (let i = ch.from; i <= ch.to; i++) ranks.push(save.stars[i] || 0);
    const perfect = ranks.filter((r) => r === 3).length;
    $('#resTitle').textContent = `Chapter complete: ${ch.name}`;
    $('#resText').textContent = `${perfect} of ${ranks.length} perfect.` + (perfect < ranks.length ? ' Replay any level from the level list.' : ' Flawless.');
    $('#chapStars').innerHTML = ranks.map((r) => `<i class="${r === 3 ? 'gold' : r === 2 ? 'silver' : ''}"></i>`).join('');
    const nx = CHAPTERS.find((c) => c.from === levelNo + 1);
    if (nx) $('#resText').insertAdjacentHTML('beforeend', `<small>Next: ${nx.name}</small>`); else $('#resText').insertAdjacentHTML('beforeend', '<small>Next: Endless mode</small>');
    $('#next').textContent = levelNo === CAMPAIGN ? 'Endless mode →' : 'Next chapter →';
  } else {
    $('#resTitle').textContent = rank === 3 ? 'Perfect!' : rank === 2 ? 'So close' : 'Solved';
    $('#resText').textContent = rank === 3 ? `${m} ${m === 1 ? 'move' : 'moves'}, the fewest possible.` : `${m} moves. It can be done in ${L.par}.`;
    $('#next').textContent = daily ? 'Back to levels' : 'Next level →';
  }
  $('#intro').classList.remove('on');
  setCoach(bonus ? 'Perfect solve: +1 hint' : '');
  setPlaying(false); if (chapterDone) cg((S) => S.game.happytime());
  draw();
  $('#knight').animate?.([{ transform: 'translateY(0)' }, { transform: 'translateY(-18%)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-8%)' }, { transform: 'translateY(0)' }], { duration: 600, easing: 'ease-out' });
  board.querySelectorAll('.cell:not(.wall)').forEach((c) => c.animate?.([{ filter: 'brightness(1)' }, { filter: 'brightness(1.12)' }, { filter: 'brightness(1)' }], { duration: 500, delay: 30 * ((+c.dataset.i % L.s) + Math.floor(+c.dataset.i / L.s)) }));
  tone(1319); tone(1568, .09); tone(2093, .18); if (chapterDone) { tone(1047, .32); tone(1319, .4); tone(1568, .48); tone(2093, .56, 'sine', 0.14, 0.6); }
  buzz([12, 40, 20]);
  document.body.classList.add('won');
  const sl = $('#seal svg'); sl?.animate?.([{ transform: 'scale(2.4) rotate(-30deg)', opacity: 0 }, { transform: 'scale(.9) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)' }], { duration: 420, delay: 120, easing: 'cubic-bezier(.3,.7,.4,1.2)', fill: 'backwards' });
  if (rank === 3 || chapterDone) confetti(chapterDone ? 90 : 46);
  setTimeout(() => $('#next').focus({ preventScroll: true }), 50);
}
$('#retry').onclick = () => restart();
$('#next').onclick = async () => {
  if (daily) { openSheet(); return; }
  if (++completions % 3 === 0) await ad('midgame');
  load(levelNo + 1);
};

// ---------- level book ----------
function openSheet() {
  const box = $('#chapters'); box.innerHTML = '';
  const endlessShown = Math.max(10, Math.ceil((save.unlocked - CAMPAIGN + 4) / 10) * 10);
  const groups = CHAPTERS.map((c) => ({ ...c })).concat([{ name: 'Endless', from: CAMPAIGN + 1, to: CAMPAIGN + endlessShown, intro: ['', 'Every rule at once'] }]);
  for (const c of groups) {
    const sec = document.createElement('section'); sec.className = 'chapter';
    const n = c.to - c.from + 1, solved = [...Array(n)].filter((_, j) => save.stars[c.from + j]).length;
    sec.innerHTML = `<h3><span>${c.name}</span><span>${solved}/${c.name === 'Endless' ? '∞' : n}</span></h3><div class="grid ${n === 6 ? 'six' : n === 4 ? 'four' : ''}"></div>`;
    const g = sec.querySelector('.grid');
    for (let lv = c.from; lv <= c.to; lv++) {
      const b = document.createElement('button'); b.className = 'lv'; b.textContent = lv;
      const s = save.stars[lv]; if (s) { const mk = document.createElement('span'); mk.className = 'mk ' + (s === 3 ? 'gold' : s === 2 ? 'silver' : 'done'); b.append(mk); }
      if (lv > save.unlocked) { b.disabled = true; b.setAttribute('aria-label', `Level ${lv}, locked`); }
      if (!daily && lv === levelNo) b.classList.add('cur');
      b.onclick = () => { closeSheet(); load(lv); };
      g.append(b);
    }
    box.append(sec);
  }
  $('#calDay').textContent = new Date().getDate();
  $('#dailyText').textContent = save.daily?.day === todaySeed() ? 'Solved today. Try for par, or come back tomorrow.' : 'A new board every day, with every rule in play.';
  $('#soundBtn').textContent = 'Sound: ' + (save.sound ? 'on' : 'off');
  $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false');
  setPlaying(false);
  setTimeout(() => $('#sheet .lv.cur')?.scrollIntoView({ block: 'center' }), 320);
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); if (!won) setPlaying(true); }
$('#levelsBtn').onclick = openSheet; $('#closeSheet').onclick = closeSheet;
$('#dailyBtn').onclick = () => { closeSheet(); load(0, true); };
$('#soundBtn').onclick = () => { save.sound = !save.sound; persist(); $('#soundBtn').textContent = 'Sound: ' + (save.sound ? 'on' : 'off'); if (save.sound) clack(); };

// Keyboard: no Escape binding (Escape exits fullscreen on CrazyGames).
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), open = $('#sheet').classList.contains('open');
  if (k === 'l') { open ? closeSheet() : openSheet(); return; }
  if (open) return;
  if (k === 'z' || k === 'backspace') undo();
  if (k === 'r') restart();
  if (k === 'h') $('#hintBtn').click();
  if ((k === 'enter' || k === ' ') && won && document.activeElement !== $('#retry')) { e.preventDefault(); $('#next').click(); }
});

// Start straight in the game.
load(Math.min(save.unlocked, Math.max(1, save.last || save.unlocked)));
</script>
</body>
