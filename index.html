<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Knight Hop: a chess puzzle game</title>
<meta name="description" content="Hop like a chess knight to collect every gem in as few moves as possible. Hundreds of levels plus a daily puzzle.">
<meta name="theme-color" content="#1e1b4b">
<style>
  :root { --bg: #1e1b4b; --bg2: #312e81; --light: #e0e7ff; --dark: #c7d2fe; --wall: #475569; --gem: #f59e0b; --ink: #f8fafc; --accent: #22d3ee; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg)); color: var(--ink); font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  .hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; width: min(92vw, 560px); }
  @media (max-width: 520px) { .hud { justify-content: center; } .btns { width: 100%; justify-content: center; } }
  .pill { background: rgba(255,255,255,.1); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: clamp(13px, 3.4vw, 16px); white-space: nowrap; }
  .btns { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 10px 14px; background: rgba(255,255,255,.14); color: var(--ink); cursor: pointer; font-size: clamp(13px, 3.4vw, 16px); }
  button:hover { background: rgba(255,255,255,.22); }
  button.primary { background: var(--accent); color: #082f49; }
  #board { position: relative; width: min(92vw, 70vh, 560px); aspect-ratio: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); touch-action: manipulation; }
  .cell { position: absolute; display: grid; place-items: center; font-size: 0; }
  .cell.l { background: var(--light); } .cell.d { background: var(--dark); }
  .cell.wall { background: var(--wall); }
  .cell.wall::after { content: ""; width: 60%; height: 60%; border-radius: 18%; background: #334155; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .cell.target { cursor: pointer; }
  .cell.target::before { content: ""; width: 30%; height: 30%; border-radius: 50%; background: rgba(34, 211, 238, .75); box-shadow: 0 0 0 6px rgba(34,211,238,.2); animation: pulse 1.2s ease-in-out infinite; }
  .cell.hint::before { background: #f43f5e; box-shadow: 0 0 0 8px rgba(244,63,94,.3); }
  @keyframes pulse { 50% { transform: scale(.8); } }
  .gem { position: absolute; display: grid; place-items: center; transition: transform .25s, opacity .25s; pointer-events: none; }
  .gem svg { width: 62%; height: 62%; filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
  .gem.got { transform: scale(1.6); opacity: 0; }
  #knight { position: absolute; display: grid; place-items: center; transition: left .22s cubic-bezier(.3,1.4,.6,1), top .22s cubic-bezier(.3,1.4,.6,1); pointer-events: none; z-index: 2; }
  #knight svg { width: 78%; height: 78%; filter: drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,10,40,.72); z-index: 10; }
  .overlay[hidden] { display: none; }
  .card { background: #fff; color: #1e1b4b; border-radius: 22px; padding: 26px 28px; width: min(88vw, 380px); text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .card h2 { margin: 0 0 6px; font-size: 28px; }
  .card p { margin: 6px 0 18px; color: #475569; }
  .stars { font-size: 44px; letter-spacing: 6px; margin: 6px 0 4px; }
  .stars .off { opacity: .2; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card button { background: #e0e7ff; color: #1e1b4b; } .card button.primary { background: #4f46e5; color: #fff; }
  .title { font-size: clamp(26px, 7vw, 42px); font-weight: 800; letter-spacing: -.5px; }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 50vh; overflow: auto; margin: 10px 0 16px; }
  .levels button { padding: 10px 0; background: #eef2ff; color: #1e1b4b; font-size: 15px; }
  .levels button small { display: block; font-size: 10px; color: #f59e0b; }
  .levels button[disabled] { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="pill" id="lvl">Level 1</span>
    <span class="pill" id="moves">Moves 0 · Best 0</span>
    <div class="btns"><button id="undo" title="Undo (Z)">↶</button><button id="restart" title="Restart (R)">⟲</button><button id="hintBtn" title="Hint (H)">💡</button><button id="menuBtn" title="Levels">☰</button></div>
  </div>
  <div id="board"></div>
</div>

<div class="overlay" id="start">
  <div class="card">
    <div class="title">♞ Knight Hop</div>
    <p>Hop like a chess knight (in an L shape) to collect every gem in as few moves as you can.</p>
    <div class="row"><button class="primary" id="play">Play</button><button id="daily">Daily puzzle</button></div>
  </div>
</div>
<div class="overlay" id="win" hidden>
  <div class="card">
    <h2 id="winTitle">Level complete!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <div class="row"><button id="retry">Try again</button><button class="primary" id="next">Next level</button></div>
  </div>
</div>
<div class="overlay" id="menu" hidden>
  <div class="card">
    <h2>Levels</h2>
    <div class="levels" id="levelGrid"></div>
    <div class="row"><button id="closeMenu">Close</button><button id="daily2">Daily puzzle</button></div>
  </div>
</div>

<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script>
'use strict';
// ---------- seeded random ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const JUMPS = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

// ---------- level generation ----------
// Difficulty rises with level: bigger boards, more gems, more walls, longer optimal solutions.
function params(n) {
  const size = n < 6 ? 5 : n < 16 ? 6 : n < 35 ? 7 : 8;
  const gems = Math.min(1 + Math.floor((n + 2) / 4), 5);
  const walls = Math.min(Math.floor(size * size * (0.08 + Math.min(n, 60) * 0.003)), Math.floor(size * size * 0.3));
  const minPar = Math.min(2 + Math.floor(n / 2), 16);
  return { size, gems, walls, minPar };
}
// Breadth-first search over (square, gems collected) to find the shortest solution.
function solve(L) {
  const { size, wall, gems, start } = L, N = size * size, G = gems.length, full = (1 << G) - 1;
  const gemAt = new Map(gems.map((g, i) => [g, i]));
  const key = (p, m) => p * (1 << G) + m;
  const prev = new Int32Array(N << G).fill(-2);
  const m0 = gemAt.has(start) ? 1 << gemAt.get(start) : 0;
  let q = [key(start, m0)]; prev[q[0]] = -1;
  for (let head = 0; head < q.length; head++) {
    const k = q[head], p = Math.floor(k / (1 << G)), m = k % (1 << G);
    if (m === full) { const path = []; let c = k; while (c !== -1) { path.push(Math.floor(c / (1 << G))); c = prev[c]; } return path.reverse(); }
    const x = p % size, y = Math.floor(p / size);
    for (const [dx, dy] of JUMPS) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
      const np = ny * size + nx; if (wall[np]) continue;
      const nm = gemAt.has(np) ? m | (1 << gemAt.get(np)) : m, nk = key(np, nm);
      if (prev[nk] !== -2) continue; prev[nk] = k; q.push(nk);
    }
  }
  return null;
}
function generate(n, seed) {
  const P = params(n), r = rng(seed);
  let best = null;
  for (let tries = 0; tries < 400; tries++) {
    const N = P.size * P.size, wall = new Uint8Array(N), cells = [...Array(N).keys()];
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
    const start = cells[0], gems = cells.slice(1, 1 + P.gems);
    cells.slice(1 + P.gems, 1 + P.gems + P.walls).forEach((c) => (wall[c] = 1));
    const L = { size: P.size, wall, gems, start };
    const path = solve(L); if (!path) continue;
    L.par = path.length - 1; L.solution = path;
    if (!best || L.par > best.par) best = L;
    if (L.par >= P.minPar) return L;
  }
  return best;
}

// ---------- state ----------
const save = (() => { try { return JSON.parse(localStorage.getItem('knighthop') || '{}'); } catch { return {}; } })();
save.stars ||= {}; save.unlocked ||= 1;
const persist = () => { try { localStorage.setItem('knighthop', JSON.stringify(save)); } catch {} };
let L, pos, got, history, levelNo, daily = false, hintOn = false;

const $ = (s) => document.querySelector(s);
const board = $('#board');

function load(n, isDaily = false) {
  daily = isDaily; levelNo = n;
  const seed = isDaily ? Number(new Date().toISOString().slice(0, 10).replace(/-/g, '')) : n * 7919 + 13;
  L = generate(isDaily ? 30 : n, seed);
  pos = L.start; got = new Set(L.gems.includes(pos) ? [pos] : []); history = []; hintOn = false;
  $('#lvl').textContent = isDaily ? 'Daily ' + new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : 'Level ' + n;
  hintsUsed = 0; cg((S) => S.game.gameplayStart());
  draw(true);
}

const KNIGHT = '<svg viewBox="0 0 45 45"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#fff" stroke="#1e1b4b" stroke-width="1.5" stroke-linejoin="round"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.99-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.99 2.5-3c1 0 1 3 1 3" fill="#fff" stroke="#1e1b4b" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="25.5" r=".9" fill="#1e1b4b"/><path d="M14.93 15.75a.5 1.5 30 1 1-.87-.5.5 1.5 30 1 1 .87.5z" fill="#1e1b4b"/></svg>';
const GEM = '<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/><path d="M2 9h20M9 3 7 9l5 12 5-12-2-6" fill="none" stroke="#b45309" stroke-width="1"/></svg>';

function targets() {
  const s = L.size, x = pos % s, y = Math.floor(pos / s), out = [];
  for (const [dx, dy] of JUMPS) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < s && ny < s && !L.wall[ny * s + nx]) out.push(ny * s + nx); }
  return out;
}
function draw(full) {
  const s = L.size, pct = 100 / s;
  if (full) {
    board.innerHTML = '';
    for (let i = 0; i < s * s; i++) {
      const x = i % s, y = Math.floor(i / s), c = document.createElement('div');
      c.className = 'cell ' + (L.wall[i] ? 'wall' : (x + y) % 2 ? 'd' : 'l');
      Object.assign(c.style, { left: x * pct + '%', top: y * pct + '%', width: pct + '%', height: pct + '%' });
      c.dataset.i = i; board.append(c);
    }
    for (const g of L.gems) {
      const e = document.createElement('div'); e.className = 'gem'; e.dataset.g = g; e.innerHTML = GEM;
      Object.assign(e.style, { left: (g % s) * pct + '%', top: Math.floor(g / s) * pct + '%', width: pct + '%', height: pct + '%' });
      board.append(e);
    }
    const k = document.createElement('div'); k.id = 'knight'; k.innerHTML = KNIGHT; k.style.width = k.style.height = pct + '%'; board.append(k);
  }
  const k = $('#knight'); k.style.left = (pos % s) * pct + '%'; k.style.top = Math.floor(pos / s) * pct + '%';
  board.querySelectorAll('.gem').forEach((g) => g.classList.toggle('got', got.has(+g.dataset.g)));
  const t = new Set(targets());
  const hint = hintOn ? nextHint() : -1;
  board.querySelectorAll('.cell').forEach((c) => { const i = +c.dataset.i; c.classList.toggle('target', t.has(i)); c.classList.toggle('hint', i === hint); });
  $('#moves').textContent = `Moves ${history.length} · Best ${L.par}`;
}
function nextHint() {
  const rest = L.gems.filter((g) => !got.has(g));
  const sub = { size: L.size, wall: L.wall, gems: rest, start: pos };
  const path = solve(sub); return path && path.length > 1 ? path[1] : -1;
}

// ---------- CrazyGames SDK (no-op when not on CrazyGames) ----------
let CG = null, muted = false, hintsUsed = 0, completions = 0;
(async () => { try { if (window.CrazyGames && window.CrazyGames.SDK) { await window.CrazyGames.SDK.init(); if (window.CrazyGames.SDK.environment !== 'disabled') CG = window.CrazyGames.SDK; } } catch {} if (CG) { try { CG.game.loadingStop(); } catch {} } })();
const cg = (f) => { try { if (CG) f(CG); } catch {} };
function ad(type) { return new Promise((res) => { if (!CG) return res(type === 'rewarded'); muted = true; cg((S) => S.game.gameplayStop());
  const done = (ok) => { muted = false; cg((S) => S.game.gameplayStart()); res(ok); };
  CG.ad.requestAd(type, { adStarted: () => {}, adFinished: () => done(true), adError: () => done(type !== 'rewarded') }); }); }

// ---------- sound ----------
let ac; function beep(f, d = 0.08, type = 'triangle', v = 0.06) { if (muted) return; try { ac ||= new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch {} }

// ---------- input ----------
board.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('.cell'); if (!c || !c.classList.contains('target')) return;
  move(+c.dataset.i);
});
function move(to) {
  history.push({ pos, got: new Set(got) }); pos = to; hintOn = false;
  if (L.gems.includes(to) && !got.has(to)) { got.add(to); beep(880, 0.15); beep(1320, 0.2, 'sine', 0.04); } else beep(440);
  draw(false);
  if (got.size === L.gems.length) setTimeout(win, 320);
}
function undo() { const h = history.pop(); if (!h) return; pos = h.pos; got = h.got; draw(false); beep(300); }
function restart() { pos = L.start; got = new Set(L.gems.includes(pos) ? [pos] : []); history = []; hintOn = false; draw(false); }
$('#undo').onclick = undo; $('#restart').onclick = restart;
$('#hintBtn').onclick = async () => {
  if (hintOn) return;
  // first hint on each level is free; after that, a short rewarded ad (only on CrazyGames)
  if (CG && hintsUsed >= 1) { if (!confirmHint()) return; const ok = await ad('rewarded'); if (!ok) return; }
  hintsUsed++; hintOn = true; draw(false);
};
function confirmHint() { const b = $('#hintBtn'); if (b.dataset.armed) { delete b.dataset.armed; b.textContent = '💡'; return true; } b.dataset.armed = 1; b.textContent = '▶💡'; b.title = 'Watch a short ad for another hint'; setTimeout(() => { delete b.dataset.armed; b.textContent = '💡'; }, 3000); return false; }
document.addEventListener('keydown', (e) => { if (e.key === 'z' || e.key === 'Z') undo(); if (e.key === 'r' || e.key === 'R') restart(); if (e.key === 'h' || e.key === 'H') $('#hintBtn').click(); });

function win() {
  const m = history.length, stars = m <= L.par ? 3 : m <= L.par + 2 ? 2 : 1;
  $('#winStars').innerHTML = [1, 2, 3].map((i) => `<span class="${i <= stars ? '' : 'off'}">★</span>`).join('');
  $('#winTitle').textContent = daily ? 'Daily puzzle solved!' : `Level ${levelNo} complete!`;
  $('#winText').textContent = stars === 3 ? `Perfect: ${m} moves, the best possible.` : `${m} moves. It can be done in ${L.par}.`;
  if (!daily) { save.stars[levelNo] = Math.max(save.stars[levelNo] || 0, stars); save.unlocked = Math.max(save.unlocked, levelNo + 1); persist(); }
  $('#next').textContent = daily ? 'Play levels' : 'Next level';
  cg((S) => S.game.gameplayStop()); if (stars === 3) cg((S) => S.game.happytime());
  $('#win').hidden = false; beep(660, 0.12); setTimeout(() => beep(990, 0.25), 120);
}
$('#retry').onclick = () => { $('#win').hidden = true; cg((S) => S.game.gameplayStart()); restart(); };
$('#next').onclick = async () => { $('#win').hidden = true; if (++completions % 3 === 0) await ad('midgame'); load(daily ? save.unlocked : levelNo + 1); };
$('#play').onclick = () => { $('#start').hidden = true; load(save.unlocked); };
$('#daily').onclick = $('#daily2').onclick = () => { $('#start').hidden = true; $('#menu').hidden = true; load(0, true); };
$('#menuBtn').onclick = () => {
  const g = $('#levelGrid'); g.innerHTML = '';
  for (let i = 1; i <= Math.max(50, save.unlocked + 10); i++) {
    const b = document.createElement('button'); b.innerHTML = i + (save.stars[i] ? `<small>${'★'.repeat(save.stars[i])}</small>` : '<small>&nbsp;</small>');
    b.disabled = i > save.unlocked; b.onclick = () => { $('#menu').hidden = true; load(i); }; g.append(b);
  }
  cg((S) => S.game.gameplayStop());
  $('#menu').hidden = false;
};
$('#closeMenu').onclick = () => { $('#menu').hidden = true; cg((S) => S.game.gameplayStart()); };
load(save.unlocked);
</script>
</body>
</html>
